[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "pytrees-rs"
description = "Optimal and greedy decision trees in Rust, with a scikit-learn API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = ["numpy>=1.23", "scipy>=1.8", "scikit-learn>=1.6"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/haroldks/pytrees-rs"
Documentation = "https://haroldks.github.io/pytrees-rs/"

# Only for working on the repository (`uv sync`); never installed by users.
[dependency-groups]
dev = [
    "maturin>=1.8,<2.0",
    "pytest>=7",
    "pre-commit",
    # check_estimator runs its pandas and array API checks only with these.
    "pandas",
    "array-api-strict",
]

[tool.maturin]
# The compiled module is `pytrees._native`; the pure-Python package around it
# holds the scikit-learn layer. The version comes from the crate's Cargo.toml.
manifest-path = "crates/pytrees-py/Cargo.toml"
module-name = "pytrees._native"
python-source = "python"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
