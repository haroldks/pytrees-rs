[workspace]
resolver = "2"
members = ["crates/dtrees", "crates/dtrees-cli", "crates/contree", "crates/contree-cli", "crates/pytrees-py"]

[workspace.package]
edition = "2021"
# The oldest compiler every crate is known to build on, declared rather than
# pinned: a rust-toolchain.toml would force every contributor onto one exact
# compiler for no reason.
rust-version = "1.77"
# Only the contree crates declare it: the repository has no LICENSE file yet.
license = "MIT"
repository = "https://github.com/haroldks/pytrees-rs"

[workspace.dependencies]
contree = { path = "crates/contree", package = "contree-rs" }
dtrees-rs = { path = "crates/dtrees" }

clap = { version = "4.5.50", features = ["derive"] }
coz = "0.1.3"
float-cmp = "0.10.0"
numpy = "0.26.0"
paste = "1.0.15"
pyo3 = "0.26.0"
rand = "0.9.2"
rustc-hash = "2.1.1"
search_trail = "0.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# Lints every crate opts into with `[lints] workspace = true`. They warn
# rather than deny, so a lint added by a newer compiler cannot break a user's
# build; CI runs clippy with -D warnings instead. Fix a warning rather than
# silence it, and when silencing is right, say why next to the #[allow].
[workspace.lints.rust]
unsafe_code = "forbid"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Beyond the defaults: the ones the Rust best-practices guide singles out.
dbg_macro = "warn"
large_enum_variant = "warn"
needless_collect = "warn"
redundant_clone = "warn"
unnecessary_wraps = "warn"

[profile.release]
lto = "fat"
opt-level = 3
