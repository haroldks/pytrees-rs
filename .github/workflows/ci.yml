name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # The oldest supported compiler and the current one: their clippy
    # versions flag different things, and both must pass.
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.77", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      # The Python bindings' Rust tests link against libpython.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all --check
      # The lints only warn in Cargo.toml, so a newer compiler cannot break a
      # user's build; here every warning fails the job.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked --release

  python:
    # The wheel is abi3: the oldest and newest supported Pythons cover it.
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest pandas array-api-strict
      - name: Test
        run: python -m pytest python/tests
