[package]
name = "pytrees-py"
description = "Python bindings for the dtrees and contree decision tree searches."
version = "1.0.3"
edition = "2021"

[lib]
# `cdylib` for the extension module itself; `lib` so the Rust side stays
# testable with `cargo test`.
name = "_native"
crate-type = ["cdylib", "lib"]

[dependencies]
numpy = "0.26.0"
pyo3 = { version = "0.26.0" }
serde_json = "1.0"
dtrees-rs = { path = "../dtrees" }

[features]
extension-module = ["pyo3/extension-module"]
