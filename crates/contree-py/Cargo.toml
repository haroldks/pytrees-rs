[package]
name = "contree-py"
description = "Python bindings for the contree optimal decision tree search."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# `cdylib` for the extension module itself; `lib` so the Rust side stays
# testable with `cargo test`.
name = "_native"
crate-type = ["cdylib", "lib"]

[dependencies]
contree.workspace = true
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py310"] }
numpy = "0.26"
serde.workspace = true
serde_json.workspace = true
