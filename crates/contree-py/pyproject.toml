[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pytrees-continuous"
description = "Optimal decision trees over continuous features, with a scikit-learn API."
requires-python = ">=3.10"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = ["numpy>=1.23", "scikit-learn>=1.3"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
# The compiled module is `pytrees_continuous._native`; the pure-Python package
# next to it holds the scikit-learn layer.
manifest-path = "Cargo.toml"
module-name = "pytrees_continuous._native"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
