[package]
name = "dtrees-cli"
description = "Command line driver for the dtrees decision tree searches."
version = "1.0.3"
edition = "2021"

# Keeps the binary's historical name, so existing scripts still work.
[[bin]]
name = "dtrees-rs"
path = "src/main.rs"

[dependencies]
dtrees-rs = { path = "../dtrees" }
clap = { version = "4.5.1", features = ["derive"] }
